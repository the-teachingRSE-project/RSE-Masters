project:
  type: book
  output-dir: _doc
  render:
    - "!presentation/"
    - "!thesis/"

format:
  pdf:
    documentclass: scrreprt
    # template: application_template.tex
    toc: False
    colorlinks: true
    toc-depth: 2
    include-in-header:
      # The Track 1/2 curriculum tables (curricula/cs.qmd, mnt.qmd) use
      # \rowcolor, which is provided by colortbl. xcolor is already loaded by
      # the default template (so \definecolor works), so we just add colortbl
      # on top -- loading \usepackage[table]{xcolor} here would clash.
      text: |
        \usepackage{colortbl}
    bibliography:
      - references.bib
      - external/bibliography/bibliography.bib
    bibliographystyle: APA

book:
  title: "RSE Curriculum"
  page-navigation: true
  chapters:
    - index.qmd
    - general/job_roles.qmd
    - curricula/cs.qmd
    - curricula/mnt.qmd
    - general/glossary.qmd



