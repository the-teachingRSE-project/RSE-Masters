name: Compile Curriculum with Quarto

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Quarto (silent)
        run: |
          wget https://quarto.org/download/latest/quarto-linux-amd64.deb -O quarto.deb
          sudo apt install -y ./quarto.deb
          rm quarto.deb
      - name: install tinytex extension
        run: quarto install tinytex
      - name: compile pdf
        run: quarto render --profile doc
      # RWTH slide decks are committed as pre-built PDFs and linked directly
      # (see modules/rse_researchmethods.qmd), so CI no longer renders them —
      # this keeps the Pages build fast and avoids the slow/hanging beamer
      # LaTeX renders. Rebuild the PDFs locally and commit them when a deck changes.
      - name: compile website
        run: quarto render --profile website
      # The role-play "»LernSpur«" is a self-contained Quarto sub-site (its own
      # navbar/theme + the confidential 🔒 role cards). Like the other nested
      # sub-projects it is excluded from the main website build so it keeps its
      # own look; we render it separately here and copy it into the published
      # tree so all cards -- including the private ones -- are viewable online.
      - name: compile role-play mini-site
        working-directory: modules/rse_management/piloting/rwth_2026/rollenspiel
        run: quarto render
      - name: publish role-play mini-site into site
        run: |
          dest=_site/modules/rse_management/piloting/rwth_2026/rollenspiel
          mkdir -p "$dest"
          cp -r modules/rse_management/piloting/rwth_2026/rollenspiel/_site/. "$dest"/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: ${{ github.event_name == 'push' }}
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
